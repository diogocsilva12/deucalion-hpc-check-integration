name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Build VSIX
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: deucalion-hpc-check-vsix
          path: '*.vsix'
          if-no-files-found: error
